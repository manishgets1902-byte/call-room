<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <title>Echo</title>
    <meta name="application-name" content="Echo">
    <meta name="apple-mobile-web-app-title" content="Echo">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%23121212'/><circle cx='256' cy='256' r='70' fill='none' stroke='%2300d2ff' stroke-width='40'/><circle cx='256' cy='256' r='150' fill='none' stroke='%2300d2ff' stroke-width='25' opacity='0.7'/><circle cx='256' cy='256' r='230' fill='none' stroke='%2300d2ff' stroke-width='15' opacity='0.3'/><circle cx='256' cy='256' r='25' fill='%2300d2ff'/></svg>">

    <!-- PeerJS (jsDelivr, pinned) -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        /* ---------- Login screen ---------- */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            text-align: center;
            overflow-y: auto;
        }

        h1 {
            color: #00d2ff;
            margin: 0 0 6px;
            font-weight: normal;
            letter-spacing: 2px;
            font-size: clamp(28px, 8vw, 36px);
        }

        .box {
            background: #1e1e1e;
            padding: clamp(20px, 6vw, 30px);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 380px;
        }

        .my-id-text {
            font-size: 16px;
            color: #aaa;
            margin: 0 0 10px;
        }

        .id-badge {
            background: #333;
            padding: 10px 16px;
            border-radius: 8px;
            color: #00d2ff;
            font-weight: bold;
            font-size: clamp(22px, 7vw, 28px);
            letter-spacing: 4px;
            display: inline-block;
            min-width: 60%;
            user-select: all;
        }

        input#partner-id {
            width: 100%;
            padding: 14px;
            margin: 20px 0 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2c2c2c;
            color: #fff;
            font-size: 18px;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
            -webkit-appearance: none;
            appearance: none;
        }
        input#partner-id:focus { border-color: #00d2ff; }

        button.call-btn {
            background: #00d2ff;
            color: #000;
            font-weight: bold;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            min-height: 48px;
            transition: background 0.3s;
            -webkit-tap-highlight-color: transparent;
        }
        button.call-btn:hover, button.call-btn:active { background: #00a8cc; }

        /* ---------- Video screen ---------- */
        #video-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            overflow: hidden;
        }

        #remote-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        /* Picture-in-picture local preview */
        #local-video {
            position: absolute;
            bottom: calc(96px + env(safe-area-inset-bottom));
            right: max(12px, env(safe-area-inset-right));
            width: clamp(90px, 28vw, 150px);
            aspect-ratio: 3 / 4;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #555;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
            background: #222;
            transform: scaleX(-1);
        }

        /* Controls bar */
        #controls {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 4vw, 20px);
            z-index: 20;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 16px;
            border-radius: 40px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            max-width: calc(100% - 24px);
        }

        .control-btn {
            width: clamp(46px, 13vw, 56px);
            height: clamp(46px, 13vw, 56px);
            flex: 0 0 auto;
            border-radius: 50%;
            border: none;
            font-size: clamp(18px, 5vw, 22px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #444;
            color: #fff;
            transition: transform 0.2s, background 0.3s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .control-btn:active { transform: scale(0.9); }

        .btn-off { background: #ff4757 !important; }
        .btn-end { background: #ff4757; }
        .btn-end:hover, .btn-end:active { background: #ff6b81; }

        /* ---------- Tablets ---------- */
        @media (min-width: 768px) {
            #local-video { width: 200px; }
            #controls { padding: 12px 24px; gap: 24px; }
            .control-btn { width: 60px; height: 60px; font-size: 24px; }
        }

        /* ---------- Landscape phones (short height) ---------- */
        @media (orientation: landscape) and (max-height: 500px) {
            #local-video {
                width: 120px;
                bottom: calc(76px + env(safe-area-inset-bottom));
            }
            #controls {
                bottom: max(10px, env(safe-area-inset-bottom));
                padding: 6px 14px;
                gap: 12px;
            }
            .control-btn { width: 44px; height: 44px; font-size: 18px; }
            #login-screen { justify-content: flex-start; }
            .box { padding: 16px 20px; }
            input#partner-id { margin: 12px 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>

    <!-- Screen 1: Login / Connect -->
    <div id="login-screen">
        <div class="box">
            <h1>Echo</h1>
            <p class="my-id-text">Your ID:</p>
            <span id="my-id" class="id-badge">...</span>
            <input type="text" id="partner-id" placeholder="Enter 6-Digit ID" maxlength="6"
                   inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            <button class="call-btn" onclick="callPartner()">Connect</button>
        </div>
    </div>

    <!-- Screen 2: Video call -->
    <div id="video-screen">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>

        <div id="controls">
            <button class="control-btn" id="mic-btn" onclick="toggleMic()" aria-label="Toggle microphone">🎤</button>
            <button class="control-btn" id="cam-btn" onclick="toggleVideo()" aria-label="Toggle camera">📹</button>
            <button class="control-btn" id="switch-btn" onclick="switchCamera()" aria-label="Switch camera">🔄</button>
            <button class="control-btn btn-end" onclick="endCall()" aria-label="End call">❌</button>
        </div>
    </div>

    <script>
        let peer;
        let localStream;
        let currentCall;
        let isMicOn = true;
        let isVideoOn = true;
        let currentFacingMode = "user";

        const generateShortId = () => Math.floor(100000 + Math.random() * 900000).toString();
        const myCustomId = generateShortId();

        peer = new Peer(myCustomId, {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });

        peer.on('open', (id) => {
            document.getElementById("my-id").innerText = id;
        });

        peer.on('error', (err) => {
            console.error(err);
            if (err.type === 'unavailable-id') {
                window.location.reload();
            }
        });

        peer.on('call', async (call) => {
            currentCall = call;
            await setupLocalStream();
            call.answer(localStream);
            showVideoScreen();
            attachCallHandlers(call);
        });

        async function callPartner() {
            const partnerId = document.getElementById("partner-id").value.trim();
            if (!/^\d{6}$/.test(partnerId)) {
                alert("Please enter a valid 6-Digit ID!");
                return;
            }
            await setupLocalStream();
            currentCall = peer.call(partnerId, localStream);
            showVideoScreen();
            attachCallHandlers(currentCall);
        }

        function attachCallHandlers(call) {
            call.on('stream', (remoteStream) => {
                document.getElementById("remote-video").srcObject = remoteStream;
            });
            call.on('close', () => {
                alert("Call ended.");
                window.location.reload();
            });
            call.on('error', (err) => {
                console.error(err);
                alert("Call failed. Please try again.");
                window.location.reload();
            });
        }

        async function setupLocalStream() {
            if (localStream) return;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode },
                    audio: true
                });
                document.getElementById("local-video").srcObject = localStream;
            } catch (err) {
                alert("Camera or Microphone permission denied!");
                console.error(err);
            }
        }

        function showVideoScreen() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("video-screen").style.display = "block";
        }

        function toggleMic() {
            if (!localStream) return;
            isMicOn = !isMicOn;
            localStream.getAudioTracks()[0].enabled = isMicOn;
            const micBtn = document.getElementById("mic-btn");
            micBtn.innerText = isMicOn ? "🎤" : "🔇";
            micBtn.classList.toggle("btn-off", !isMicOn);
        }

        function toggleVideo() {
            if (!localStream) return;
            isVideoOn = !isVideoOn;
            localStream.getVideoTracks()[0].enabled = isVideoOn;
            const camBtn = document.getElementById("cam-btn");
            camBtn.innerText = isVideoOn ? "📹" : "🚫";
            camBtn.classList.toggle("btn-off", !isVideoOn);
        }

        async function switchCamera() {
            if (!localStream) return;

            const oldVideoTrack = localStream.getVideoTracks()[0];
            oldVideoTrack.stop();

            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";

            const newStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: currentFacingMode },
                audio: false
            });

            const newVideoTrack = newStream.getVideoTracks()[0];
            newVideoTrack.enabled = isVideoOn;

            localStream.removeTrack(oldVideoTrack);
            localStream.addTrack(newVideoTrack);
            document.getElementById("local-video").srcObject = localStream;

            if (currentCall && currentCall.peerConnection) {
                const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === "video");
                if (sender) sender.replaceTrack(newVideoTrack);
            }

            document.getElementById("local-video").style.transform =
                currentFacingMode === "environment" ? "scaleX(1)" : "scaleX(-1)";
        }

        function endCall() {
            if (currentCall) currentCall.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            window.location.reload();
        }
    </script>
</body>
</html>
